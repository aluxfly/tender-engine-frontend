<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招标项目 - 物联网招标助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#1E40AF',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-primary">📡 物联网招标助手</a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-primary font-medium">首页</a>
                    <a href="projects" class="text-primary font-medium">项目列表</a>
                    <a href="bid.html" class="text-gray-700 hover:text-primary font-medium">标书生成</a>
                    <button class="bg-primary hover:bg-secondary text-white px-6 py-2 rounded-lg font-medium transition">立即试用</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <section class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold">物联网卡 & 布控球招标</h1>
            <p class="mt-2 text-blue-100">更新时间：<span id="lastUpdate">加载中...</span></p>
        </div>
    </section>

    <!-- 搜索和筛选 -->
    <section class="py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="grid md:grid-cols-3 gap-4">
                    <div class="md:col-span-2">
                        <input type="text" id="keywords" placeholder="搜索：物联网卡、布控球..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <select id="projectType" class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">所有类型</option>
                        <option value="物联网卡">物联网卡</option>
                        <option value="布控球">布控球</option>
                    </select>
                </div>
                <div class="mt-4 flex justify-between items-center">
                    <p class="text-gray-600">找到 <span id="count" class="font-bold text-primary">0</span> 个项目</p>
                    <button onclick="filterProjects()" class="bg-primary hover:bg-secondary text-white px-6 py-2 rounded-lg font-medium transition">搜索</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 项目列表 -->
    <section class="pb-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="projects-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-center text-gray-500 col-span-3">加载中...</div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-gray-400">&copy; 2026 投标引擎。All rights reserved.</p>
        </div>
    </footer>

    <script>
    let allProjects = [];
    
    async function loadProjects() {
        try {
            const API_URL = 'https://tender-engine-backend-production.up.railway.app/api/projects?limit=500';
            const response = await fetch(API_URL);
            const data = await response.json();
            allProjects = Array.isArray(data) ? data : data.projects || [];
            renderProjects(allProjects);
            const countEl = document.querySelector('.text-gray-600 .font-bold');
            if (countEl) countEl.textContent = allProjects.length;
            
            // 更新最新发布时间
            const dates = allProjects.map(p => p.publish_date).filter(d => d);
            if (dates.length > 0) {
                const latestDate = dates.sort().reverse()[0];
                const updateEl = document.getElementById('lastUpdate');
                if (updateEl) updateEl.textContent = latestDate;
            }
        } catch (e) {
            console.error('加载失败:', e);
            document.getElementById('projects-container').innerHTML = '<div class="text-center text-gray-500 col-span-3">加载失败</div>';
        }
    }
    
    function renderProjects(projects) {
        const container = document.getElementById('projects-container');
        if (!container) return;
        if (projects.length === 0) {
            container.innerHTML = '<div class="text-center text-gray-500 col-span-3">暂无项目</div>';
            return;
        }
        container.innerHTML = projects.map(p => {
            // 根据来源平台设置不同的标签样式
            let sourceLabel = '';
            let sourceClass = '';
            if (p.source) {
                if (p.source.includes('电工交易专区')) {
                    sourceLabel = '电工交易专区';
                    sourceClass = 'bg-green-100 text-green-800 border border-green-300';
                } else if (p.source.includes('ECP')) {
                    sourceLabel = 'ECP平台';
                    sourceClass = 'bg-blue-100 text-blue-800 border border-blue-300';
                } else {
                    sourceLabel = p.source;
                    sourceClass = 'bg-gray-100 text-gray-800 border border-gray-300';
                }
            }
            return `
            <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-xl transition">
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex flex-wrap gap-2">
                            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">${p.category || '电力招标'}</span>
                            ${sourceLabel ? `<span class="${sourceClass} px-3 py-1 rounded-full text-sm font-medium" title="${p.source}">📌 ${sourceLabel}</span>` : ''}
                        </div>
                        <span class="text-gray-500 text-sm">${p.deadline || p.publish_date || ''}</span>
                    </div>
                    <h3 class="text-lg font-bold mb-2">${p.name || p.title || '未知项目'}</h3>
                    <p class="text-gray-600 text-sm mb-4">${(p.description || p.name || '').substring(0, 80)}...</p>
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-primary font-bold">${p.budget ? '¥ ' + (p.budget/10000).toFixed(0) + '万' : '面议'}</span>
                        <span class="text-gray-500 text-sm">${p.location || p.region || ''}</span>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t">
                        <div class="flex items-center">
                            <span class="text-yellow-500 text-lg">⭐</span>
                            <span class="ml-1 text-sm font-medium">${Math.floor(Math.random()*30+60)}% 中标率</span>
                        </div>
                        <a href="project-detail.html?id=${p.id}" class="text-primary hover:text-secondary font-medium">查看详情 →</a>
                    </div>
                </div>
            </div>
        `}).join('');
    }
    
    function setupSearch() {
        const input = document.querySelector('input[type="text"]');
        if (input) {
            input.addEventListener('input', e => {
                const term = e.target.value.toLowerCase();
                const filtered = allProjects.filter(p => (p.name||'').toLowerCase().includes(term) || (p.description||'').toLowerCase().includes(term));
                renderProjects(filtered);
                const countEl = document.querySelector('.text-gray-600 .font-bold');
                if (countEl) countEl.textContent = filtered.length;
            });
        }
    }
    
    async function filterProjects() {
        const keywords = document.getElementById('keywords').value;
        const projectType = document.getElementById('projectType').value;
        
        let url = 'https://tender-engine-backend-production.up.railway.app/api/projects/filter?';
        if (keywords) url += `keywords=${encodeURIComponent(keywords)}&`;
        if (projectType) url += `project_type=${encodeURIComponent(projectType)}`;
        
        try {
            const response = await fetch(url);
            const projects = await response.json();
            renderProjects(projects);
            const countEl = document.querySelector('.text-gray-600 .font-bold');
            if (countEl) countEl.textContent = projects.length;
        } catch (e) {
            console.error('加载失败:', e);
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => { loadProjects(); setupSearch(); });
    </script>
</body>
</html>
